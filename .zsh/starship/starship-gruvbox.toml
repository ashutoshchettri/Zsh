"$schema" = 'https://starship.rs/config-schema.json'

format = """
[󰣇 ](fg:ctp_blue)\
$directory\
$git_branch\
$git_status\
$git_metrics\
$c$rust$golang$nodejs$php$java$kotlin$haskell$python\
$docker_context\
$fill\
$time\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[palettes.catppuccin_mocha]
ctp_fg = '#cdd6f4'
ctp_bg = '#1e1e2e'
ctp_subtext = '#a6adc8'
ctp_blue = '#89b4fa'
ctp_teal = '#94e2d5'
ctp_green = '#a6e3a1'
ctp_mauve = '#cba6f7'
ctp_red = '#f38ba8'
ctp_yellow = '#f9e2af'

[directory]
style = "fg:ctp_mauve"
format = "[$path]($style) "
truncation_length = 3

[git_branch]
symbol = "󰊢 "
style = "fg:ctp_teal"
format = "on [$symbol$branch]($style) "

[git_status]
style = "fg:ctp_red"
format = "([$all_status$ahead_behind]($style) )"
# Configuration for specific change counts
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "$"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_metrics]
disabled = false
added_style = "fg:ctp_green"
deleted_style = "fg:ctp_red"
format = "([+$added]($added_style) [-$deleted]($deleted_style) )"

[nodejs]
symbol = " "
style = "fg:ctp_green"
format = "via [$symbol($version)]($style) "

[rust]
symbol = " "
style = "fg:ctp_red"
format = "via [$symbol($version)]($style) "

[python]
symbol = " "
style = "fg:ctp_yellow"
format = "via [$symbol($version)]($style) "

[fill]
symbol = " "

[time]
disabled = false
time_format = "%I:%M %p"
style = "fg:ctp_subtext"
format = "[$time]($style)"

[character]
success_symbol = "[❯](ctp_green)"
error_symbol = "[❯](ctp_red)"

[line_break]
disabled = false
